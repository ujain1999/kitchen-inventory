[project]
name = "kitchen-inventory"
version = "0.1.0"
description = "A personal kitchen inventory management discord bot that lets you track groceries and pantry items via chat commands."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.6.4",
    "google-auth>=2.48.0",
    "gspread>=6.2.1",
    "oauth2client>=4.1.3",
    "python-dotenv>=1.2.1",
]
